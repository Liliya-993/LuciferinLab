<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Чудовиська грецької міфології</title>
    </head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Merriweather", serif;
            background: linear-gradient(to bottom, #1a2233, #0d0f12);
            color: #f8f5ef; /* світліший перловий */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
        }

        .logo {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
        }

        p {
            margin-top: 20px;
            padding-bottom: 600px;
            max-width: 900px;
            text-align: center;
            font-size: 30px;
            color: #ddd;
        }

        p#last {
            padding-bottom: 50px;
        }

        /* Сітка кнопок 2x2 */
        .buttons-wrap {
            margin: 30px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 900px; /* фіксована ширина для симетрії */
        }

        .choose-buttons-wrap {
            margin: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 900px; /* фіксована ширина для симетрії */
        }

        .buttons-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e3dc;
            background-color: #1a2233;
            padding: 15px;
            border-radius: 15px; /* заокруглені кути */
            font-size: 20px;
            font-weight: 600;
            height: 100px;
            transition: transform 0.5s ease;
            text-decoration: none;
        }

        .choose-buttons-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e3dc;
            background-color: #1a2233;
            padding: 15px;
            border-radius: 15px; /* заокруглені кути */
            font-size: 20px;
            font-weight: 600;
            height: 100px;
            transition: transform 0.5s ease;
            text-decoration: none;
        }

        .buttons-wrap a:hover {
            background-color: #d1cfc8;
            transform: translateY(-4px);
            color: #1a2233;
        }

        .choose-buttons-wrap a:hover {
            background-color: #d1cfc8;
            transform: translateY(-4px);
            color: #1a2233;
        }
    </style>
    <body>
        <!-- Головний блок -->
        <main class="main">
            <!-- Походження світу і богів -->
            <p></p>
            <!-- Кнопки -->
            <div class="choose-buttons-wrap">
                <a href="#" class="choose-button">Зевс</a>
                <a href="#" class="choose-button">Посейдон</a>
                <a href="#" class="choose-button">Аїд</a>
                <a href="#" class="choose-button">Гера</a>
                <a href="#" class="choose-button">Аполлон</a>
                <a href="#" class="choose-button">Артеміда</a>
                <a href="#" class="choose-button">Афіна Паллада</a>
                <a href="#" class="choose-button">Гермес</a>
                <a href="#" class="choose-button">Арес</a>
                <a href="#" class="choose-button">Афродіта</a>
                <a href="#" class="choose-button">Пігмаліон</a>
                <a href="#" class="choose-button">Нарцис</a>
                <a href="#" class="choose-button">Адоніс</a>
                <a href="#" class="choose-button">Деметра</a>
                <a href="#" class="choose-button">Персефона</a>
                <a href="#" class="choose-button">Діоніс</a>
            </div>
            <div class="buttons-wrap">
                <a href="Greek.html" class="shift-button">Повернутися назад</a>
                <a href="Mithology.html" class="shift-button"
                    >Повернутися на головну</a
                >
            </div>
        </main>
    </body>
</html>
