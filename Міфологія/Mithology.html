<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Міфи та Міфології</title>
    </head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Merriweather", serif;
            background: linear-gradient(to bottom, #1a2233, #0d0f12);
            color: #f8f5ef; /* світліший перловий */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: scroll;
            height: 100%;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
        }

        .logo img {
            align-items: center;
            width: 350px;
            height: 350px;
            padding-bottom: 40px;
        }

        .intro-subtitle {
            margin-top: 20px;
            max-width: 900px;
            text-align: center;
            font-size: 30px;
            color: #ddd;
        }

        /* Сітка кнопок 2x2 */
        .buttons-wrap {
            margin: 30px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 900px; /* фіксована ширина для симетрії */
        }

        .buttons-wrap a {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            color: #e5e3dc;
            background-color: #1a2233;
            padding: 15px;
            border-radius: 15px; /* заокруглені кути */
            font-size: 20px;
            font-weight: 600;
            height: 100px;
            transition: transform 0.5s ease;
            text-decoration: none;
        }

        .buttons-wrap a:hover {
            background-color: #d1cfc8;
            transform: translateY(-4px);
            color: #1a2233;
        }

        .footer {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 20px 16px; /* вертикальні/горизонтальні відступи */
            gap: 6px; /* відстань між рядками */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: transparent;
            color: #d1cfc8;
            text-align: center;
        }

        .footer h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #d1cfc8;
        }
        .footer a {
            color: #d1cfc8;
            text-decoration: none;
            text-underline-offset: 3px;
        }
        .footer a:hover {
            opacity: 0.5;
        }
        /* Кастомна смуга прокрутки */
        /* Chrome, Edge, Brave, Safari */
        ::-webkit-scrollbar {
            width: 10px;
            background: linear-gradient(
                to bottom,
                #1a2233,
                #0d0f12
            ); /* прозорий фон */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #d1cfc8; /* колір бігунка */
            border-radius: 10px;
            border: 2px solid linear-gradient(to bottom, #1a2233, #0d0f1200); /* прозорі межі */
        }

        /* Firefox */
        * {
            scrollbar-color: #d1cfc8
                linear-gradient(to bottom, #1a2233, #0d0f1200);
        }
    </style>
    <body>
        <!-- Контейнер для particles.js -->
        <div
            id="particles-js"
            style="
                position: fixed;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                z-index: -1;
            "
        ></div>

        <!-- Головний блок -->
        <main class="main">
            <!-- Логотип -->
            <div class="logo">
                <img src="/images/logo.svg" alt="Mythos Logo" />
            </div>

            <!-- Коротке пояснення -->
            <p class="intro-subtitle">
                Сайт присвячений різноманітним міфам та міфологіям світу — від
                давніх богів до легенд народів.
            </p>

            <!-- Кнопки -->
            <div class="buttons-wrap">
                <a href="Greek.html" class="shift-button"
                    >Міфи давньої Греції</a
                >
                <a href="#" class="shift-button">Міфи Скандинавії</a>
                <a href="#" class="shift-button">Міфи Японії</a>
                <a href="#" class="shift-button">Слов'янська міфологія</a>
            </div>
            <div class="footer">
                <h1>Джерела:</h1>
                <p>"Міфи давньої греції" Серія "Шкільна бібліотека"</p>
                <p>© 2025 Mythos. Всі права захищені.</p>
                <a href="https://www.instagram.com/web_goblin_/"
                    >Інстаграм: web_goblin_</a
                >
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    </body>
    <script>
        particlesJS("particles-js", {
            particles: {
                number: {
                    value: 60,
                    density: { enable: true, value_area: 800 },
                },
                color: { value: "#ffffff" },
                shape: {
                    type: "circle",
                },
                opacity: {
                    value: 0.5,
                    random: false,
                },
                size: {
                    value: 3,
                    random: true,
                },
                line_linked: {
                    enable: true,
                    distance: 140,
                    color: "#ffffff",
                    opacity: 0.4,
                    width: 1,
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: "none",
                    random: false,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                },
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true,
                },
                modes: {
                    grab: { distance: 140, line_linked: { opacity: 1 } },
                    bubble: {
                        distance: 400,
                        size: 40,
                        duration: 2,
                        opacity: 8,
                        speed: 3,
                    },
                    repulse: { distance: 200, duration: 0.4 },
                    push: { particles_nb: 4 },
                    remove: { particles_nb: 2 },
                },
            },
            retina_detect: true,
        });
    </script>
</html>
